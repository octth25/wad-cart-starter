name: Tests and format check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This starter has no runtime or dev dependencies, so no npm install is needed.
      - name: Run unit tests
        run: npm test
      - name: Check formatting
        run: npm run format:check
